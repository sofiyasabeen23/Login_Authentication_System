<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | SecureAuth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

    <nav>
        <h2>SecureAuth</h2>
        <button id="logout">Logout</button>
    </nav>

    <div class="welcome">
        <span>● Authenticated</span>

        <h1>Welcome, <b id="userName">User</b>!</h1>

        <p>
            You have successfully logged in to your protected dashboard.
        </p>
    </div>

    <div class="cards">

        <div class="card">
            <h3>👤 Account</h3>
            <p id="userEmail">Email</p>
        </div>

        <div class="card">
            <h3>🔐 Security</h3>
            <p>Password protected</p>
        </div>

        <div class="card">
            <h3>✓ Status</h3>
            <p>Session active</p>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
